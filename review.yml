actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No public API of any transport exists for Magic, so no AsyncAPI document
    was created and no OpenAPI, Postman/Open Collection, plans, rate-limits, or
    FinOps artifacts were authored - there is nothing sourced to put in them.
    The apis.yml documents Magic honestly as a pre-product frontier research
    lab with an empty apis list and a common-properties block limited to the
    verifiable public surfaces (website, blog, careers, safety page, GitHub
    organization, LinkedIn). Reconcile this entry if Magic launches a public
    developer API.
